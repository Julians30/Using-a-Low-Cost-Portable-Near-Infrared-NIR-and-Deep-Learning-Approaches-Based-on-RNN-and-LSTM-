[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nir-eggs-leakage-safe"
version = "0.1.0"
description = "Leakage-safe reproducibility utilities for SCiO NIR shell-egg storage-time prediction"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Julián Coronel-Reyes"}
]
keywords = [
  "near-infrared spectroscopy",
  "shell eggs",
  "storage time",
  "chemometrics",
  "deep learning",
  "grouped cross-validation",
  "reproducibility"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scipy>=1.13,<2",
  "scikit-learn>=1.4,<2",
  "joblib>=1.3,<2"
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8,<4"]
deep = ["tensorflow>=2.16,<3"]
notebooks = ["jupyter>=1.0,<2", "nbformat>=5.10,<6"]
test = ["pytest>=8,<9"]
full = [
  "matplotlib>=3.8,<4",
  "tensorflow>=2.16,<3",
  "jupyter>=1.0,<2",
  "nbformat>=5.10,<6",
  "pytest>=8,<9"
]

[project.urls]
Repository = "https://github.com/Julians30/Using-a-Low-Cost-Portable-Near-Infrared-NIR-and-Deep-Learning-Approaches-Based-on-RNN-and-LSTM-"

[project.scripts]
nir-eggs-verify-splits = "nir_eggs.cli:verify_splits_main"
nir-eggs-audit-data = "nir_eggs.cli:audit_data_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
