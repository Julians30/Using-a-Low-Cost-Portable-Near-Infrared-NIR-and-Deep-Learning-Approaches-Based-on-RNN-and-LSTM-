name: Reproducibility checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install reproducibility package and test dependencies
        run: pip install -e '.[test]'

      - name: Run core reproducibility tests
        run: pytest

      - name: Run installed split-verification command
        run: nir-eggs-verify-splits

      - name: Validate frozen split files against manifest
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          root = Path('data/frozen_splits')
          manifest_path = root / 'split_manifest.json'
          manifest = json.loads(manifest_path.read_text())

          for name, expected in manifest['files'].items():
              p = root / name
              assert p.exists(), f'Missing frozen split file: {p}'
              observed = hashlib.sha256(p.read_bytes()).hexdigest()
              assert observed == expected, f'Hash mismatch for {name}: {observed} != {expected}'

          print('PASS — frozen split hashes match split_manifest.json')
          PY
